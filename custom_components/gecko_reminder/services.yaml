save_settings:
  name: Сохранить настройки кормления
  description: Периодичность и Telegram-уведомления через настроенный получатель Home Assistant.
  fields:
    feeding_interval_days:
      name: Интервал в днях
      description: Передайте null для отключения периодичности.
      required: true
      selector:
        number:
          min: 1
          max: 365
          mode: box
    reminder_enabled:
      name: Включить уведомления
      required: true
      selector:
        boolean:
    reminder_time:
      name: Время ЧЧ:ММ
      required: true
      example: "19:00"
      selector:
        text:
    reminder_target:
      name: Сущность или действие notify.…
      required: true
      selector:
        text:
set_feeding_interval:
  name: Настроить периодичность кормления
  description: Интервал после последней записи. Передайте null для отключения подсветки.
  fields:
    feeding_interval_days:
      name: Раз в сколько дней кормить
      required: true
      selector:
        number:
          min: 1
          max: 365
          step: 1
          mode: box
save_feeding:
  name: Сохранить кормление
  description: Создать кормление или изменить запись по её id.
  fields:
    id:
      name: ID записи
      description: Оставьте пустым для нового кормления.
      selector:
        text:
    date:
      name: Дата кормления
      required: true
      selector:
        date:
    insect:
      name: Насекомое
      required: true
      selector:
        select:
          options:
            - label: Сверчок
              value: cricket
            - label: Саранча
              value: locust
            - label: Таракан дубия
              value: dubia
            - label: Мучной червь
              value: mealworm
            - label: Зофобас
              value: superworm
            - label: Другое
              value: other
    count:
      name: Количество
      required: true
      selector:
        number:
          min: 1
          max: 99
          step: 1
          mode: box
    supplement:
      name: Добавка
      required: true
      selector:
        select:
          options:
            - label: Без добавки
              value: none
            - label: Кальций
              value: calcium
            - label: Кальций + D3
              value: calcium_d3
            - label: Витамины
              value: vitamins
    notes:
      name: Заметка
      selector:
        text:
          multiline: true
delete_feeding:
  name: Удалить кормление
  description: Удалить одну запись по её id.
  fields:
    id:
      name: ID записи
      required: true
      selector:
        text:
